# ============================================================
# AI Image Restoration & Enhancement System — Default Config
# ============================================================

# Device strategy: auto-detect CUDA, fallback to CPU
device: "auto"  # "auto" | "cuda" | "cpu"

# --- Upload Constraints ---
upload:
  max_file_size_mb: 10
  max_width: 4096
  max_height: 4096
  allowed_extensions: [".jpg", ".jpeg", ".png", ".webp", ".bmp"]

# --- Degradation Analyzer Thresholds ---
# Scores are 0.0–1.0; severity mapped as:
#   score < 0.35  → LOW
#   0.35 <= score < 0.65 → MEDIUM
#   score >= 0.65 → HIGH
analyzer:
  blur:
    laplacian_threshold: 250.0   # Below this, image is considered blurry
  noise:
    sigma_threshold: 15.0        # Above this, image is considered noisy
  resolution:
    min_dimension: 512           # Below this, image is considered low resolution
  exposure:
    low_light_threshold: 0.35    # Mean luminance below this is low light (scale 0-1)
    overexposure_threshold: 0.70 # Mean luminance above this is overexposed
    dark_ratio_threshold: 0.20   # % of dark pixels
    bright_ratio_threshold: 0.20 # % of bright pixels
  jpeg_artifacts:
    blocking_threshold: 0.40     # Blockness measure above this is considered jpeg artifacts

# --- Pipeline Planner ---
planner:
  # Default operation order (validated experimentally)
  default_order:
    - "denoise"
    - "low_light"
    - "deblur"
    - "jpeg_artifacts"
    - "super_resolution"
  # Minimum severity to trigger a model ("LOW", "MEDIUM", "HIGH")
  min_severity: "MEDIUM"

# --- Model Configuration ---
models:
  denoising:
    name: "DRUNet"
    weights_repo: "Ansh205/image-restoration-models"
    weights_path: "drunet/drunet_color.pth"
  deblurring:
    name: "Restormer"
    weights_repo: "Ansh205/image-restoration-models"
    weights_path: "restormer/restormer_deblurring.pth"
    use_lora: false
    lora_path: "restormer-lora/"
  super_resolution:
    name: "Real-ESRGAN"
    weights_repo: "Ansh205/image-restoration-models"
    weights_path: "realesrgan/RealESRGAN_x4plus.pth"
    scale_factor: 4
  low_light:
    name: "Zero-DCE++"
    weights_repo: "Ansh205/image-restoration-models"
    weights_path: "zerodce/zero_dce_pp.pth"
  jpeg_artifacts:
    name: "SwinIR"
    weights_repo: "Ansh205/image-restoration-models"
    weights_path: "swinir/swinir_jpeg.pth"

# --- Inference ---
inference:
  # Max input size for deployment (resize if larger)
  max_inference_size: 1024

# --- Logging ---
logging:
  level: "INFO"
  log_file: "logs/app.log"
