# ============================================================
# AI Image Restoration & Enhancement System — Default Config
# ============================================================

# Device strategy: auto-detect CUDA, fallback to CPU
device: "auto"  # "auto" | "cuda" | "cpu"

# --- Upload Constraints ---
upload:
  max_file_size_mb: 10
  max_width: 4096
  max_height: 4096
  allowed_extensions: [".jpg", ".jpeg", ".png", ".webp", ".bmp"]

# --- Degradation Analyzer Thresholds ---
# Scores are 0.0–1.0; severity mapped as:
#   score < 0.35  → LOW
#   0.35 <= score < 0.65 → MEDIUM
#   score >= 0.65 → HIGH
analyzer:
  blur:
    laplacian_threshold: 150.0   # Below this, image is considered blurry
  noise:
    sigma_threshold: 3.0        # Above this, image is considered noisy
  resolution:
    min_dimension: 512           # Below this, image is considered low resolution
  exposure:
    low_light_threshold: 0.35    # Mean luminance below this is low light (scale 0-1)
    overexposure_threshold: 0.70 # Mean luminance above this is overexposed
    dark_ratio_threshold: 0.20   # % of dark pixels
    bright_ratio_threshold: 0.20 # % of bright pixels
  jpeg_artifacts:
    blocking_threshold: 0.40     # Blockness measure above this is considered jpeg artifacts

# --- Pipeline Planner ---
planner:
  # Default operation order (validated experimentally)
  default_order:
    - "denoise"
    - "low_light"
    - "deblur"
    - "jpeg_artifacts"
    - "super_resolution"
  # Minimum severity to trigger a model ("LOW", "MEDIUM", "HIGH")
  min_severity: "MEDIUM"
  # Minimum activation thresholds for scheduling restoration models
  min_activation_thresholds:
    noise: 0.15
    blur: 0.15
    low_light: 0.15
    jpeg_artifacts: 0.35
    low_resolution: 0.15

# --- Model Configuration ---
models:
  denoising:
    name: "DRUNet"
    weights_repo: "Ansh205/image-restoration-models"
    weights_path: "drunet/drunet_color.pth"
  deblurring:
    name: "Restormer"
    weights_repo: "Ansh205/image-restoration-models"
    weights_path: "restormer/restormer_deblurring.pth"
    use_lora: false
    lora_path: "restormer-lora/"
  super_resolution:
    name: "Real-ESRGAN"
    weights_repo: "Ansh205/image-restoration-models"
    weights_path: "realesrgan/RealESRGAN_x4plus.pth"
    scale_factor: 4
  low_light:
    name: "Zero-DCE++"
    weights_repo: "Ansh205/image-restoration-models"
    weights_path: "zerodce/zero_dce_pp.pth"
  jpeg_artifacts:
    name: "SwinIR"
    weights_repo: "Ansh205/image-restoration-models"
    weights_path: "swinir/swinir_jpeg.pth"

# --- Evaluator ---
evaluator:
  min_improvement_pct: 0.03       # 3% minimum meaningful improvement for primary targets
  denoise:
    min_noise_reduction_pct: 0.03 # Noise estimate must decrease by at least 3%
    max_sharpness_loss_pct: 0.15  # Laplacian sharpness must not drop by more than 15%
  deblur:
    min_sharpness_gain_pct: 0.03  # Laplacian sharpness must increase by at least 3%
    max_noise_increase_pct: 0.35  # Noise sigma must not increase by more than 35%
  low_light:
    min_luminance_gain_pct: 0.03  # Mean luminance must improve by at least 3% or dark ratio reduce
    max_bright_clip_ratio: 0.25   # Bright clip ratio must not exceed 25%
  jpeg_artifacts:
    min_blocking_reduction_pct: 0.03 # JPEG blocking score must decrease by at least 3%
    max_sharpness_loss_pct: 0.15     # Sharpness must not drop by more than 15%
  super_resolution:
    expected_scale_factor: 4      # Dimensions must scale appropriately

# --- Inference ---
inference:
  # Max input size for deployment (resize if larger)
  max_inference_size: 1024

# --- Logging ---
logging:
  level: "INFO"
  log_file: "logs/app.log"

